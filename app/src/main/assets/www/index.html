<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Chaos Faction 2</title>
<style>
html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#000; color:#fff; font-family:sans-serif; }
#stage { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
#game { width:min(100vw, calc(100vh * 4 / 3)); height:min(100vh, calc(100vw * 3 / 4)); transform-origin:center center; }
ruffle-player { width:100%; height:100%; }
#status { position:absolute; left:20px; bottom:20px; color:#ddd; font-size:14px; }
</style>
</head>
<body>
<div id="stage"><div id="game"></div></div>
<div id="status">Starting Chaos Faction 2…</div>
<script>
window.RufflePlayer = window.RufflePlayer || {};
window.RufflePlayer.config = {
  autoplay: 'on', unmuteOverlay: 'visible', letterbox: 'on', contextMenu: 'off',
  allowScriptAccess: true, allowNetworking: 'all', publicPath: 'ruffle/',
  quality: 'high', scale: 'showAll', forceScale: true
};
let player;
let cf2Ready = false;
let cf2MenuPaused = false, cf2BackgroundPaused = false, cf2RufflePaused = false;
let cf2DisplayMode = 'original';
function syncRufflePause() {
  const paused = cf2MenuPaused || cf2BackgroundPaused;
  if (!cf2Ready || !player || cf2RufflePaused === paused) return;
  try {
    if (paused) player.ruffle().suspend();
    else player.ruffle().resume();
  } catch (error) {
    try {
      if (paused && typeof player.pause === 'function') player.pause();
      else if (!paused && typeof player.play === 'function') player.play();
    } catch (fallbackError) {
      console.warn('ChaosFaction2 pause failed', fallbackError);
      return;
    }
  }
  cf2RufflePaused = paused;
  if (!paused && player) player.focus();
}
window.cf2SetMenuPaused = value => {
  cf2MenuPaused = !!value;
  if (cf2MenuPaused) window.cf2ClearKeys();
  syncRufflePause();
};
window.cf2SetBackgroundPaused = value => {
  cf2BackgroundPaused = !!value;
  if (cf2BackgroundPaused) window.cf2ClearKeys();
  syncRufflePause();
};
window.cf2SetDisplayMode = mode => {
  cf2DisplayMode = mode === 'stretch' ? 'stretch' : 'original';
  const game = document.getElementById('game');
  if (!game) return;
  game.style.transform = '';
  if (cf2DisplayMode === 'stretch') {
    const box = game.getBoundingClientRect();
    if (box.width && box.height) {
      game.style.transform = 'scale(' + (innerWidth / box.width) + ',' + (innerHeight / box.height) + ')';
    }
  }
};
window.addEventListener('resize', () => window.cf2SetDisplayMode(cf2DisplayMode));
document.addEventListener('visibilitychange', () => window.cf2SetBackgroundPaused(document.hidden));
const keys = {
  up:{key:'ArrowUp',code:'ArrowUp',keyCode:38},
  down:{key:'ArrowDown',code:'ArrowDown',keyCode:40},
  left:{key:'ArrowLeft',code:'ArrowLeft',keyCode:37},
  right:{key:'ArrowRight',code:'ArrowRight',keyCode:39},
  attack1:{key:'z',code:'KeyZ',keyCode:90},
  attack2:{key:'x',code:'KeyX',keyCode:88},
  melee:{key:'Shift',code:'ShiftLeft',keyCode:16},
  drop:{key:'d',code:'KeyD',keyCode:68},
  pause:{key:' ',code:'Space',keyCode:32}
};
const sources = Object.create(null);
function sendCF2Key(id, pressed) {
  const spec = keys[id];
  player.dispatchEvent(new KeyboardEvent(pressed ? 'keydown' : 'keyup', {
    key:spec.key, code:spec.code, keyCode:spec.keyCode, which:spec.keyCode,
    bubbles:true, composed:true, cancelable:true,
    shiftKey:!!(sources.melee && sources.melee.size)
  }));
}
window.cf2Key = (id, pressed, source) => {
  // Alternate buttons share the movement keys without releasing other holders.
  if (id === 'jump') id = 'up';
  if (id === 'shield') id = 'down';
  if (pressed && (cf2MenuPaused || cf2BackgroundPaused)) return;
  if (!keys[id] || !player || !cf2Ready) return;
  if (!sources[id]) sources[id] = new Set();
  const wasDown = sources[id].size > 0;
  if (pressed) sources[id].add(source); else sources[id].delete(source);
  const nowDown = sources[id].size > 0;
  if (wasDown === nowDown) return;
  player.focus();
  sendCF2Key(id, nowDown);
};
window.cf2ClearKeys = () => {
  for (const [id, holders] of Object.entries(sources)) {
    if (!holders.size) continue;
    holders.clear();
    if (player) sendCF2Key(id, false);
  }
};
window.addEventListener('load', async () => {
  const status = document.getElementById('status');
  try {
    const ruffle = window.RufflePlayer.newest();
    if (!ruffle) throw new Error('Ruffle runtime missing');
    player = ruffle.createPlayer();
    player.style.width = '100%';
    player.style.height = '100%';
    document.getElementById('game').appendChild(player);
    await player.ruffle().load({
      url:'/game/chaos-faction-2.swf', allowNetworking:'all',
      allowScriptAccess:true, quality:'high'
    });
    cf2Ready = true;
    status.remove();
    window.cf2SetDisplayMode(cf2DisplayMode);
    syncRufflePause();
    player.focus();
  } catch (e) {
    status.textContent = 'Game load failed: ' + String(e);
    console.error('ChaosFaction2 load failed', e);
  }
});
</script>
<script src="ruffle/ruffle.js"></script>
</body>
</html>
