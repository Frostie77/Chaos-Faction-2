name: Android development builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify real controller profile
        run: python3 tests/test_control_profile.py
      - name: Verify input ownership, modifier and lifecycle
        run: node tests/test_input.cjs
      - name: Verify stable updater
        run: python3 tests/test_updates.py
      - name: Install Android 35
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Retrieve pinned Ruffle
        run: |
          curl --fail --location --silent --show-error https://registry.npmjs.org/@ruffle-rs/ruffle/-/ruffle-0.7.1.tgz -o /tmp/cf2-ruffle.tgz
          echo 'dc9e7407549a91accc41a14932b0b9d9a9d51a3742ce6f020888c8a76682b157  /tmp/cf2-ruffle.tgz' | sha256sum -c -
          mkdir -p /tmp/cf2-ruffle app/src/main/assets/www/ruffle
          tar -xzf /tmp/cf2-ruffle.tgz -C /tmp/cf2-ruffle
          cp -R /tmp/cf2-ruffle/package/. app/src/main/assets/www/ruffle/
      - name: Build Debug and Release
        run: gradle --no-daemon :frostfrontend:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease
      - name: Verify Android identity, launcher and game-free payload
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib, json, os, re, subprocess
          aapt = str(Path(os.environ['ANDROID_HOME']) / 'build-tools/35.0.0/aapt')
          runtime = json.loads(Path('ruffle-0.7.1.sha256.json').read_text())
          for variant, filename in [('debug','app-debug.apk'),('release','app-release-unsigned.apk')]:
              apk = Path('app/build/outputs/apk') / variant / filename
              resources = subprocess.check_output([aapt,'dump','resources',str(apk)],text=True)
              assert re.search(r'\bdrawable/launcher_art\b',resources), 'Approved icon artwork resource missing'
              with ZipFile(apk) as archive:
                  names = set(archive.namelist())
                  assert not any(n.lower().endswith('.swf') for n in names), 'Game bundled'
                  assert 'assets/www/index.html' in names
                  for name, digest in runtime.items():
                      assert hashlib.sha256(archive.read('assets/www/ruffle/' + name)).hexdigest() == digest
              badging = subprocess.check_output([aapt,'dump','badging',str(apk)],text=True)
              version = '0.1.0-dev' if variant == 'debug' else '0.1.0'
              assert "name='io.github.frostie77.chaosfaction2' versionCode='2' versionName='" + version + "'" in badging
              assert "sdkVersion:'26'" in badging
              assert "application-label:'Chaos Faction 2'" in badging
              icon = re.search(r"(?m)^application:.*icon='([^']+)'",badging)
              assert icon and icon.group(1) in names
              if variant == 'release': assert 'application-debuggable' not in badging
              print('PASS:',variant,'identity, icon, runtime and game-free APK')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Chaos-Faction-2-Android-debug-for-testing
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
  windows-helper:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Parse helpers with Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach ($name in @('build-test.ps1', 'build-public-release.ps1')) {
            $parseErrors = $null
            $tokens = $null
            $file = Join-Path $env:GITHUB_WORKSPACE $name
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          }
          Write-Host 'PASS: build helpers parse in Windows PowerShell 5.1.'

      - name: Use JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Install Android 35 platform
        shell: powershell
        run: |
          & "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat" 'platforms;android-35' 'build-tools;35.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK setup failed.' }

      - name: Exercise release signing and mismatched-key protection with a disposable key
        shell: powershell
        run: |
          $productionFeed = Join-Path $env:GITHUB_WORKSPACE 'updates\android-stable.json'
          $productionFeedHash = (Get-FileHash -Algorithm SHA256 $productionFeed).Hash
          # A local fixture commit resets only the feed, allowing disposable-key
          # tests to keep working after the real permanent signer is published.
          $fixtureRepo = Join-Path $env:RUNNER_TEMP 'cf2-release-fixture'
          & git clone --no-hardlinks $env:GITHUB_WORKSPACE $fixtureRepo
          if ($LASTEXITCODE -ne 0) { throw 'Fixture checkout failed.' }
          Set-Location $fixtureRepo
          $emptyFeed = @{schema_version=1; channel='stable'; package='io.github.frostie77.chaosfaction2'; latest=$null}
          [System.IO.File]::WriteAllText((Join-Path $fixtureRepo 'updates\android-stable.json'), ($emptyFeed | ConvertTo-Json))
          & git add updates/android-stable.json
          & git -c user.name='Release Test' -c user.email='release-test@example.invalid' commit --allow-empty -m 'Set up isolated first-release fixture'
          if ($LASTEXITCODE -ne 0) { throw 'Fixture commit failed.' }
          $fixtureParent = (& git rev-parse HEAD^).Trim()
          if ($fixtureParent -ne $env:GITHUB_SHA) { throw 'Fixture does not derive from the workflow source.' }
          $env:CF2_CI_SIGNING_PASSWORD = [Guid]::NewGuid().ToString('N')
          $fixture = Join-Path $env:RUNNER_TEMP 'cf2-disposable-test.keystore'
          & .\build-public-release.ps1 -KeystorePath $fixture -SigningPasswordEnvironment CF2_CI_SIGNING_PASSWORD
          $sha = (& git rev-parse HEAD).Trim()
          $folder = Get-ChildItem '.\release' -Directory | Select-Object -First 1
          $feed = Get-Content -Raw (Join-Path $folder.FullName 'android-stable.json') | ConvertFrom-Json
          if ($feed.latest.source_commit -ne $sha) { throw 'Release source metadata mismatch.' }
          $apk = Join-Path $folder.FullName $feed.latest.apk_asset
          $beforeHash = (Get-FileHash -Algorithm SHA256 $apk).Hash.ToLowerInvariant()
          if ($beforeHash -ne $feed.latest.apk_sha256 -or (Get-Item $apk).Length -ne $feed.latest.apk_size) {
            throw 'Staged feed does not describe the actual signed APK.'
          }
          $pin = $fixture + '.certificate.sha256'
          $originalPin = Get-Content -Raw $pin
          $rejected = $false
          try {
            Set-Content -LiteralPath $pin -Value ('b' * 64)
            try {
              & .\build-public-release.ps1 -KeystorePath $fixture -SigningPasswordEnvironment CF2_CI_SIGNING_PASSWORD
            } catch {
              if ($_.Exception.Message -notmatch 'established local release identity') { throw }
              $rejected = $true
            }
          } finally {
            Set-Content -LiteralPath $pin -Value $originalPin
            Remove-Item Env:\CF2_CI_SIGNING_PASSWORD
          }
          if (-not $rejected) { throw 'Mismatched release identity was accepted.' }
          if ((Get-FileHash -Algorithm SHA256 $apk).Hash.ToLowerInvariant() -ne $beforeHash) {
            throw 'Failed signing attempt changed the verified candidate.'
          }
          $live = Get-Content -Raw '.\updates\android-stable.json' | ConvertFrom-Json
          if ($null -ne $live.latest) { throw 'Release preparation activated the live feed.' }
          if ((Get-FileHash -Algorithm SHA256 $productionFeed).Hash -ne $productionFeedHash) {
            throw 'Fixture changed the production feed.'
          }
          Write-Host 'PASS: real signed APK, matching feed, signature/identity checks and rejected mismatched key; live feed unchanged.'
