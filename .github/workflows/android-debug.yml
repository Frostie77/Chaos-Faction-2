name: Android development builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify real controller profile
        run: python3 tests/test_control_profile.py
      - name: Verify input ownership, modifier and lifecycle
        run: node tests/test_input.cjs
      - name: Verify stable updater
        run: python3 tests/test_updates.py
      - name: Install Android 35
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Retrieve pinned Ruffle
        run: |
          curl --fail --location --silent --show-error https://registry.npmjs.org/@ruffle-rs/ruffle/-/ruffle-0.7.1.tgz -o /tmp/cf2-ruffle.tgz
          echo 'dc9e7407549a91accc41a14932b0b9d9a9d51a3742ce6f020888c8a76682b157  /tmp/cf2-ruffle.tgz' | sha256sum -c -
          mkdir -p /tmp/cf2-ruffle app/src/main/assets/www/ruffle
          tar -xzf /tmp/cf2-ruffle.tgz -C /tmp/cf2-ruffle
          cp -R /tmp/cf2-ruffle/package/. app/src/main/assets/www/ruffle/
      - name: Build Debug and Release
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease
      - name: Verify Android identity, launcher and game-free payload
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib, json, os, re, subprocess
          aapt = str(Path(os.environ['ANDROID_HOME']) / 'build-tools/35.0.0/aapt')
          runtime = json.loads(Path('ruffle-0.7.1.sha256.json').read_text())
          for variant, filename in [('debug','app-debug.apk'),('release','app-release-unsigned.apk')]:
              apk = Path('app/build/outputs/apk') / variant / filename
              with ZipFile(apk) as archive:
                  names = set(archive.namelist())
                  assert not any(n.lower().endswith('.swf') for n in names), 'Game bundled'
                  assert 'assets/www/index.html' in names
                  for name, digest in runtime.items():
                      assert hashlib.sha256(archive.read('assets/www/ruffle/' + name)).hexdigest() == digest
              badging = subprocess.check_output([aapt,'dump','badging',str(apk)],text=True)
              version = '0.1.0-dev' if variant == 'debug' else '0.1.0'
              assert "name='io.github.frostie77.chaosfaction2' versionCode='1' versionName='" + version + "'" in badging
              assert "sdkVersion:'26'" in badging
              assert "application-label:'Chaos Faction 2'" in badging
              icon = re.search(r"(?m)^application:.*icon='([^']+)'",badging)
              assert icon and icon.group(1) in names
              if variant == 'release': assert 'application-debuggable' not in badging
              print('PASS:',variant,'identity, icon, runtime and game-free APK')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Chaos-Faction-2-Android-debug-for-testing
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
  windows-helper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows build helper
        shell: powershell
        run: |
          $errors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE 'build-test.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Host 'PASS: Windows PowerShell 5.1 build helper parses.'
